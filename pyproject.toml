[project]
name = "coding-agents"
version = "0.2.32"
description = "A unified runtime for managing coding agents (Claude Code, Codex, etc.)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "structlog>=26.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.0.0",
    "prometheus-client>=0.21.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
    "pytest-benchmark>=4.0.0",
    "pytest-timeout>=2.2.0",
    "psutil>=5.9.0",
]

[project.scripts]
coding-agents = "coding_agents.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 300

[tool.coverage.run]
source = ["coding_agents"]
omit = ["tests/*"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pip-audit>=2.10.1",
    "psutil>=7.2.2",
    "pytest-asyncio>=1.4.0",
    "pytest-benchmark>=5.2.3",
    "pytest-timeout>=2.4.0",
    "types-PyYAML>=6.0",
]
